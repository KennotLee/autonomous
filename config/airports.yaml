# Per-airport config (P1 owns). Code in src/ must read airports from here; no hardcoded airports.
# runway_heading_deg: organiser assumption (all ops on this heading). Used as given (not corrected for
#   magnetic vs true north; wind direction from Meteostat is true north).
# timezone: IANA tz, from Meteostat station metadata (Stations().fetch(), row where icao == key),
#   checked 2026-10-31.
# meteostat: always look the station up at runtime by ICAO via the meteostat package; do not
#   hardcode station IDs here.
# iata: code used in the BTS on-time data (ORIGIN / DEST columns).

airports:
  KATL:
    iata: ATL
    runway_heading_deg: 80
    timezone: America/New_York
    meteostat:
      lookup: icao
  KDFW:
    iata: DFW
    runway_heading_deg: 180
    timezone: America/Chicago
    meteostat:
      lookup: icao

# Other airports on hub flights are resolved automatically: ICAO = 'K'+IATA, else 'P'+IATA, if that
# ICAO exists in the Meteostat station list (timezone taken from Meteostat). Exceptions below were
# checked against Meteostat Stations().fetch() on 2026-10-31.
iata_icao_overrides:
  SJU: {icao: TJSJ}
  OGG: {icao: PHOG}
  STT: {icao: TIST}
  STX: {icao: TISX}
  FCA: {icao: KGPI}
  # Lawton-Fort Sill Regional: KLAW is not in Meteostat -> no weather (NaN), timezone given here.
  LAW: {icao: KLAW, timezone: America/Chicago, meteostat: false}

meteostat:
  weather_start: "2022-12-30"   # >= 18 h before first flight for 12 h horizon + 6 h rolling window
  weather_end: "2025-08-02"
  asof_tolerance_hours: 2
  horizons: [3, 6, 9, 12]
  rolling_windows_hours: [3, 6]
